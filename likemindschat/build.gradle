plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-parcelize'
    id 'realm-android'
}

ext {
    PUBLISH_GROUP_ID = 'community.likeminds'
    PUBLISH_VERSION = "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"
    PUBLISH_ARTIFACT_ID = 'likemindschat'
}

apply from: '../publish-helper.gradle'

android {
    compileSdk versions.compile_sdk

    defaultConfig {
        namespace 'com.likeminds.likemindschat'
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            manifestPlaceholders = [sentryEnvironment: "chatsdk-beta", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        release {
            manifestPlaceholders = [sentryEnvironment: "chatsdk-production", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

apply from: "likemindschat-dependencies.gradle"