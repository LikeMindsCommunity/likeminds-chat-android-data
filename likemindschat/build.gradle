plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'io.realm.kotlin'
}

android {
    namespace 'com.likeminds.likemindschat'
    compileSdk versions.compile_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            manifestPlaceholders = [sentryEnvironment: "chatsdk-beta", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        release {
            manifestPlaceholders = [sentryEnvironment: "chatsdk-production", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

apply from:"likemindschat-dependencies.gradle"